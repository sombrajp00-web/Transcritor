<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transcriptor de Audio</title>
<link rel="manifest" href="manifest.json">
<style>
  body { font-family: Arial, sans-serif; max-width: 600px; margin: auto; padding: 20px; background:#f5f5f5;}
  h1 { text-align:center; color:#333; }
  button { padding: 14px 20px; margin: 8px 4px; border:none; border-radius:10px; font-size:16px; cursor:pointer; }
  #recordBtn { background:#e74c3c; color:white; }
  #recordBtn.recording { background:#c0392b; }
  #fileBtn { background:#3498db; color:white; }
  #copyBtn, #downloadBtn { background:#2ecc71; color:white; }
  textarea { width:100%; height:220px; margin-top:15px; padding:10px; font-size:15px; border-radius:8px; border:1px solid #ccc; box-sizing: border-box;}
  #status { text-align:center; color:#666; margin-top:10px; font-size:14px; }
  .buttons { display:flex; flex-wrap:wrap; justify-content:center; }
</style>
</head>
<body>
<h1>🎙️ Transcriptor de Audio</h1>
<div class="buttons">
  <button id="recordBtn" disabled>🔴 Grabar</button>
  <button id="fileBtn" disabled>📁 Subir audio</button>
</div>
<input type="file" id="fileInput" accept="audio/*" style="display:none">
<p id="status">Cargando modelo, espera un momento...</p>
<textarea id="output" placeholder="Aquí aparecerá el texto transcrito..."></textarea>
<div class="buttons">
  <button id="copyBtn">📋 Copiar texto</button>
  <button id="downloadBtn">💾 Descargar TXT</button>
</div>

<script type="module">
import { pipeline, env } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.2';

// IMPORTANTE: forzar un solo hilo, GitHub Pages no soporta multi-hilo WASM
env.backends.onnx.wasm.numThreads = 1;
env.allowLocalModels = false;

const statusEl = document.getElementById('status');
const outputEl = document.getElementById('output');
const recordBtn = document.getElementById('recordBtn');
const fileBtn = document.getElementById('fileBtn');
const fileInput = document.getElementById('fileInput');
const copyBtn = document.getElementById('copyBtn');
const downloadBtn = document.getElementById('downloadBtn');

let transcriber = null;
let mediaRecorder = null;
let audioChunks = [];
let isRecording = false;

window.addEventListener('unhandledrejection', (e) => {
  statusEl.textContent = '❌ Error: ' + (e.reason?.message || e.reason);
});
window.addEventListener('error', (e) => {
  statusEl.textContent = '❌ Error: ' + e.message;
});

async function loadModel() {
  try {
    statusEl.textContent = 'Descargando modelo (una sola vez)...';
    transcriber = await pipeline('automatic-speech-recognition', 'Xenova/whisper-tiny', {
      progress_callback: (data) => {
        if (data.status === 'progress' && data.progress) {
          statusEl.textContent = `Descargando modelo: ${Math.round(data.progress)}%`;
        }
      }
    });
    statusEl.textContent = '✅ Modelo listo. Graba o sube un audio.';
    recordBtn.disabled = false;
    fileBtn.disabled = false;
  } catch (err) {
    statusEl.textContent = '❌ Error al cargar el modelo: ' + err.message;
    console.error(err);
  }
}
loadModel();

async function transcribeAudioBlob(blob) {
  statusEl.textContent = '⏳ Procesando audio...';
  outputEl.value = '';
  try {
    const arrayBuffer = await blob.arrayBuffer();
    const audioContext = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
    const decoded = await audioContext.decodeAudioData(arrayBuffer);
    const audioData = decoded.getChannelData(0);

    statusEl.textContent = '⏳ Transcribiendo (puede tardar unos segundos)...';

    const result = await transcriber(audioData, {
      language: 'spanish',
      task: 'transcribe',
      chunk_length_s: 30,
      stride_length_s: 5,
    });

    outputEl.value = result.text.trim();
    statusEl.textContent = '✅ Transcripción completa.';
  } catch (err) {
    statusEl.textContent = '❌ Error al transcribir: ' + err.message;
    console.error(err);
  }
}

recordBtn.addEventListener('click', async () => {
  if (!isRecording) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];
      mediaRecorder.ondataavailable = (e) => audioChunks.push(e.data);
      mediaRecorder.onstop = async () => {
        const blob = new Blob(audioChunks, { type: 'audio/webm' });
        await transcribeAudioBlob(blob);
        stream.getTracks().forEach(track => track.stop());
      };
      mediaRecorder.start();
      isRecording = true;
      recordBtn.textContent = '⏹️ Detener';
      recordBtn.classList.add('recording');
      statusEl.textContent = '🎙️ Grabando...';
    } catch (err) {
      statusEl.textContent = '❌ No se pudo acceder al micrófono: ' + err.message;
    }
  } else {
    mediaRecorder.stop();
    isRecording = false;
    recordBtn.textContent = '🔴 Grabar';
    recordBtn.classList.remove('recording');
  }
});

fileBtn.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (file) await transcribeAudioBlob(file);
  fileInput.value = '';
});

copyBtn.addEventListener('click', () => {
  outputEl.select();
  document.execCommand('copy');
  statusEl.textContent = '📋 Texto copiado.';
});

downloadBtn.addEventListener('click', () => {
  const blob = new Blob([outputEl.value], { type: 'text/plain' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'transcripcion.txt';
  a.click();
  URL.revokeObjectURL(url);
});

if ('serviceWorker' in navigator) {
  navigator.serviceWorker.register('sw.js').catch(console.error);
}
</script>
</body>
  </html>
